name: hisab

services:
  # ========================================
  # POSTGRESQL
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: hisab-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Dhaka}

    volumes:
      - hisab_postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-3318}:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - hisab-network

  # ========================================
  # FULL-STACK HISAB APPLICATION
  # ========================================
  web:
    container_name: hisab-web

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Dhaka}

      HOST: 0.0.0.0
      PORT: ${APP_INTERNAL_PORT:-3000}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: ${APP_INTERNAL_PORT:-3000}

      APP_URL: ${APP_URL}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}

      DATABASE_URL: ${DATABASE_URL}

      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}

      JWT_SECRET: ${JWT_SECRET}
      INIT_DB: ${INIT_DB:-true}
      OPENING_PHONE: ${OPENING_PHONE:-}
      OPENING_PIN: ${OPENING_PIN:-}
      OPENING_NAME: ${OPENING_NAME:-মালিক}
      OPENING_SHOP_NAME: "${OPENING_SHOP_NAME:-আমার দোকান}"

    ports:
      - "${APP_HOST_PORT:-7011}:${APP_INTERNAL_PORT:-3000}"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - hisab-network

networks:
  hisab-network:
    driver: bridge

volumes:
  hisab_postgres_data:
